[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arkcode"
version = "0.1.0"
description = "A Python project for ArkCode."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "alexTuT-v", email = "alexxuzq@163.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
arkcode = "arkcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
