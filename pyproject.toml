[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Arkcode"
version = "0.1.0"
description = "一个支持 Anthropic 与 OpenAI 协议的终端 AI 对话客户端。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "mcp>=1.0",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13",
  "textual>=0.80",
]

[project.scripts]
Arkcode = "Arkcode.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/Arkcode"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["Arkcode"]
strict = true
warn_unused_ignores = false
