mcp_servers:
  github:
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
  local-sqlite:
    type: stdio
    command: uvx
    args:
      - mcp-server-sqlite
      - --db-path
      - ./example.db
  example-http:
    type: http
    url: https://example.com/mcp
    headers:
      Authorization: "Bearer ${EXAMPLE_TOKEN}"
